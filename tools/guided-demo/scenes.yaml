# Orion-X Phoenix Edition — guided walkthrough (v2.2.0-beta)
#
# Single source for the narrated demo: each scene names the visual it shows
# and the narration spoken over it. tools/guided-demo/build.sh renders the
# visuals from the real v2.2.0-beta image/apps, synthesises the narration,
# and derives the MP4, the WebVTT captions and the Markdown transcript from
# THIS file — so the three artefacts can never disagree.
#
# Rules for the narration (same standard as the User Guide): describe only
# what the beta actually does; no invented metrics; say "beta" out loud.

title: "Orion-X Phoenix Edition — guided walkthrough"
version: "v2.2.0-beta"
release_url: "https://github.com/jarocki/orion/releases/tag/v2.2.0-beta"
resolution: [1280, 720]
fps: 24

scenes:
  - id: boot
    visual: splash          # Plymouth Phoenix splash (the theme's real background)
    heading: "Boot from a stick"
    narration: >-
      This is Orion-X Phoenix Edition, version 2.2.0 beta: a live USB cyberdeck
      for incident responders working in networks they cannot trust. It boots
      from a USB stick on Debian 13, runs from the stick with all changes held in
      memory, and works fully air-gapped. Nothing is installed on, or written
      to, the machine you are standing at.

  - id: desktop
    visual: desktop         # real XFCE session: Phoenix wallpaper + branded panel + live widgets
    heading: "A desktop built for 3 a.m."
    narration: >-
      The desktop is XFCE, themed as a cyberdeck. The panel shows what matters
      at a glance: the mesh you are joined to, scan and intrusion events seen on
      the event bus, and the number of hosts on the local network. Every Orion-X
      tool lives under one Orion menu.

  - id: control-center
    visual: cc-awareness    # Control Center → Awareness section
    heading: "Control Center"
    narration: >-
      The Control Center is designed for your 3 a.m. self. Live health, the
      WireGuard mesh, and the firewall are on one page. Threat posture has
      three tiers, from passive to deception. R.A.I.N. — Real-time Audible
      Intrusion Notification — turns detections into severity-mapped sound
      cues, so an intrusion is heard, not just watched.

  - id: nebula
    visual: cc-nebula       # Control Center → Nebula AI section
    heading: "Nebula: a local copilot"
    narration: >-
      Nebula is the on-device assistant: ollama serving Qwen 2.5 3B, verified
      at boot by a SHA-256 integrity gate before it is allowed to start. It can
      reach twelve local MCP tools — pcap summaries, artifact analysis, OAST
      decoding, nuclei-template lookups — and nothing leaves the deck.

  - id: cockpit
    visual: cockpit         # Orion Cockpit --demo, captured as a frame sequence
    heading: "The Cockpit"
    narration: >-
      The Cockpit is where you see and hear the cyber activity around you: a
      scrolling event stream, a threat-pressure gauge that decays over time, a
      network sparkline, subsystem lights and the current posture. This feed is
      synthetic demo traffic; on a real deck it is the live event bus.

  - id: toolkit
    visual: toolkit         # terminal montage: nucleotide, roast, zeek, tshark, vol
    heading: "The toolkit"
    narration: >-
      Underneath is a curated forensics toolkit: Wireshark and Zeek for the
      wire, Volatility 3 for memory, capa and YARA for binaries, go-roast for
      out-of-band payloads, and nucleotide, which maps URLs to nuclei templates
      from a lookup table built into the image.

  - id: pivotglass
    visual: pivotglass      # Pivotglass web UI with the offline learning case
    heading: "Pivotglass"
    narration: >-
      Pivotglass is the adversary-infrastructure hunting deck. It runs locally
      in the browser, keeps hypotheses, evidence and contradictions as separate
      records, and ships with an offline learning case so you can practise
      without any network at all.

  - id: release
    visual: guide           # rendered User Guide + release download page
    heading: "Get the beta"
    narration: >-
      The full User Guide is rendered into the image and on GitHub. The beta
      ISO is 3.09 gigabytes, published as seven parts because of GitHub's
      two-gigabyte limit: download them, concatenate, verify the SHA-256, and
      write the image to an eight-gigabyte stick. Beta means we want your bug
      reports. That is Orion-X.
