<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="Hack, 'DejaVu Sans Mono', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10131a"/><stop offset="1" stop-color="#07080b"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6a13"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="380" fill="url(#bg)"/>
  <g stroke="#1a2130" stroke-width="1"><path d="M0 60H960M0 120H960M0 180H960M0 240H960M0 300H960M120 0V380M240 0V380M360 0V380M480 0V380M600 0V380M720 0V380M840 0V380"/></g>
  <text x="24" y="34" fill="#ff6a13" font-size="15" font-weight="bold" letter-spacing="2" filter="url(#glow)">NEBULA · ON-DEVICE AI WITH MCP TOOLS</text>
  <text x="24" y="52" fill="#8a919b" font-size="11">nothing leaves the deck — the model, the tools and the audit log all run locally</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="100" width="170" height="52" rx="6" fill="#0d1017" stroke="#8a919b"/><text x="115" y="122" fill="#e6e6e6" font-weight="bold">nebula chat</text><text x="115" y="140" fill="#8a919b" font-size="10.5">terminal session</text>
    <rect x="30" y="170" width="170" height="52" rx="6" fill="#0d1017" stroke="#8a919b"/><text x="115" y="192" fill="#e6e6e6" font-weight="bold">Control Center</text><text x="115" y="210" fill="#8a919b" font-size="10.5">"Ask Nebula" pane</text>
    <rect x="30" y="240" width="170" height="52" rx="6" fill="#0d1017" stroke="#8a919b"/><text x="115" y="262" fill="#e6e6e6" font-weight="bold">any MCP client</text><text x="115" y="280" fill="#8a919b" font-size="10.5">nebula tools --serve</text>

    <rect x="290" y="130" width="190" height="100" rx="8" fill="#0d1017" stroke="#ff6a13" stroke-width="1.8" filter="url(#glow)"/>
    <text x="385" y="158" fill="#ff6a13" font-weight="bold" letter-spacing="1">NEBULA RUNTIME</text>
    <text x="385" y="178" fill="#f0f0f0" font-size="11">ollama · Qwen2.5-3B-Instruct</text>
    <text x="385" y="195" fill="#8a919b" font-size="10.5">Q4_K_M · localhost:11434</text>
    <text x="385" y="212" fill="#8a919b" font-size="10.5">nebula-runtime.service</text>

    <rect x="560" y="130" width="180" height="100" rx="8" fill="#0d1017" stroke="#33d9ff" stroke-width="1.6"/>
    <text x="650" y="158" fill="#33d9ff" font-weight="bold" letter-spacing="1">MCP TOOL SERVER</text>
    <text x="650" y="178" fill="#f0f0f0" font-size="11">JSON-RPC over stdio</text>
    <text x="650" y="195" fill="#8a919b" font-size="10.5">argv only · no shell · timeouts</text>
    <text x="650" y="212" fill="#8a919b" font-size="10.5">audit: /var/log/orionx/nebula-mcp.log</text>
  </g>
  <!-- tools column -->
  <g font-size="11" fill="#e6e6e6">
    <rect x="800" y="86" width="140" height="210" rx="6" fill="#0d1017" stroke="#ffb15c"/>
    <text x="870" y="106" text-anchor="middle" fill="#ffb15c" font-weight="bold" font-size="11.5">CURATED TOOLS</text>
    <text x="812" y="128">nebula_status</text><text x="812" y="145">systemctl_status</text><text x="812" y="162">list_connections</text>
    <text x="812" y="179">wg_show</text><text x="812" y="196">tshark_summary</text><text x="812" y="213">pcap_analyze</text>
    <text x="812" y="230">artifact_analyze</text>
    <text x="812" y="252" fill="#ffb15c">oast_extract   ┐</text><text x="812" y="269" fill="#ffb15c">oast_decode    ├ roast</text><text x="812" y="286" fill="#ffb15c">oast_analyze   ┘</text>
  </g>
  <g stroke="#ff6a13" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M200 126 C245 126 245 165 290 165"/><path d="M200 196 L290 185"/><path d="M200 266 C245 266 245 205 290 205"/>
    <path d="M480 180 L560 180"/><path d="M740 180 L800 180"/>
  </g>
  <text x="480" y="345" fill="#8a919b" font-size="10.5" text-anchor="middle">Every tool call is validated against a schema, run as plain argv with a timeout, and written to the audit log — the model can look, it cannot improvise commands.</text>
</svg>
