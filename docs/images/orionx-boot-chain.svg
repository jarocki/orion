<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="Hack, 'DejaVu Sans Mono', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10131a"/><stop offset="1" stop-color="#07080b"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6a13"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="300" fill="url(#bg)"/>
  <g stroke="#1a2130" stroke-width="1"><path d="M0 60H960M0 120H960M0 180H960M0 240H960M120 0V300M240 0V300M360 0V300M480 0V300M600 0V300M720 0V300M840 0V300"/></g>
  <text x="24" y="34" fill="#ff6a13" font-size="15" font-weight="bold" letter-spacing="2" filter="url(#glow)">ORION-X BOOT CHAIN</text>
  <text x="24" y="52" fill="#8a919b" font-size="11">power-on → desktop · every Orion-X boot-time component in order</text>
  <!-- boxes -->
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="110" width="130" height="64" rx="6" fill="#0d1017" stroke="#ff6a13" stroke-width="1.4"/>
    <text x="95" y="136" fill="#f0f0f0" font-weight="bold">FIRMWARE</text><text x="95" y="154" fill="#8a919b" font-size="10.5">UEFI · or · BIOS/CSM</text>
    <rect x="200" y="86" width="150" height="50" rx="6" fill="#0d1017" stroke="#ff6a13" stroke-width="1.4"/>
    <text x="275" y="107" fill="#f0f0f0" font-weight="bold">GRUB (UEFI)</text><text x="275" y="124" fill="#8a919b" font-size="10.5">plain menu · 5 s</text>
    <rect x="200" y="148" width="150" height="50" rx="6" fill="#0d1017" stroke="#ff6a13" stroke-width="1.4"/>
    <text x="275" y="169" fill="#f0f0f0" font-weight="bold">isolinux (BIOS)</text><text x="275" y="186" fill="#8a919b" font-size="10.5">Phoenix menu · 5 s</text>
    <rect x="390" y="110" width="140" height="64" rx="6" fill="#0d1017" stroke="#33d9ff" stroke-width="1.4"/>
    <text x="460" y="136" fill="#f0f0f0" font-weight="bold">KERNEL 6.12</text><text x="460" y="154" fill="#8a919b" font-size="10.5">live-boot · squashfs</text>
    <rect x="570" y="110" width="140" height="64" rx="6" fill="#0d1017" stroke="#ff6a13" stroke-width="1.4"/>
    <text x="640" y="136" fill="#f0f0f0" font-weight="bold">PLYMOUTH</text><text x="640" y="154" fill="#8a919b" font-size="10.5">Orion-X Phoenix splash</text>
    <rect x="750" y="86" width="180" height="50" rx="6" fill="#0d1017" stroke="#ffb15c" stroke-width="1.4"/>
    <text x="840" y="107" fill="#f0f0f0" font-weight="bold">FIRST-BOOT WIZARD</text><text x="840" y="124" fill="#8a919b" font-size="10.5">tty1 · hostname · account · Wi-Fi</text>
    <rect x="750" y="148" width="180" height="50" rx="6" fill="#0d1017" stroke="#34ff9e" stroke-width="1.4"/>
    <text x="840" y="169" fill="#f0f0f0" font-weight="bold">LightDM → XFCE</text><text x="840" y="186" fill="#8a919b" font-size="10.5">Control Center autostarts</text>
  </g>
  <!-- arrows -->
  <g stroke="#ff6a13" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M160 130 L200 111"/><path d="M160 154 L200 173"/>
    <path d="M350 111 L390 130"/><path d="M350 173 L390 154"/>
    <path d="M530 142 L570 142"/>
    <path d="M710 130 L750 111"/><path d="M710 154 L750 173"/>
    <path d="M840 136 L840 148"/>
  </g>
  <text x="480" y="268" fill="#8a919b" font-size="10.5" text-anchor="middle">The wizard runs once (first boot only) and quits the splash to take the console; on later boots the splash hands straight to the login manager.</text>
</svg>
