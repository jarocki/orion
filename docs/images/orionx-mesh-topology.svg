<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="Hack, 'DejaVu Sans Mono', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10131a"/><stop offset="1" stop-color="#07080b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="360" fill="url(#bg)"/>
  <g stroke="#1a2130" stroke-width="1"><path d="M0 60H960M0 120H960M0 180H960M0 240H960M0 300H960M120 0V360M240 0V360M360 0V360M480 0V360M600 0V360M720 0V360M840 0V360"/></g>
  <text x="24" y="34" fill="#ff6a13" font-size="15" font-weight="bold" letter-spacing="2" filter="url(#glow)">WIREGUARD P2P MESH · NO HUB</text>
  <text x="24" y="52" fill="#8a919b" font-size="11">every deck peers directly with every other; a central server is optional, never required</text>
  <!-- peer links (full mesh of 4) -->
  <g stroke="#ff6a13" stroke-width="1.6" stroke-opacity="0.85">
    <line x1="260" y1="130" x2="520" y2="130"/><line x1="260" y1="130" x2="260" y2="290"/><line x1="260" y1="130" x2="520" y2="290"/>
    <line x1="520" y1="130" x2="520" y2="290"/><line x1="520" y1="130" x2="260" y2="290"/><line x1="260" y1="290" x2="520" y2="290"/>
  </g>
  <g stroke="#33d9ff" stroke-width="1.4" stroke-dasharray="6 5" stroke-opacity="0.8">
    <line x1="520" y1="130" x2="770" y2="210"/><line x1="520" y1="290" x2="770" y2="210"/>
  </g>
  <!-- nodes -->
  <g font-size="11.5" text-anchor="middle">
    <g><circle cx="260" cy="130" r="34" fill="#0d1017" stroke="#ff6a13" stroke-width="2" filter="url(#glow)"/><text x="260" y="126" fill="#f0f0f0" font-weight="bold">ox-alpha</text><text x="260" y="142" fill="#8a919b" font-size="10">10.44.0.1</text></g>
    <g><circle cx="520" cy="130" r="34" fill="#0d1017" stroke="#ff6a13" stroke-width="2" filter="url(#glow)"/><text x="520" y="126" fill="#f0f0f0" font-weight="bold">ox-bravo</text><text x="520" y="142" fill="#8a919b" font-size="10">10.44.0.2</text></g>
    <g><circle cx="260" cy="290" r="34" fill="#0d1017" stroke="#ff6a13" stroke-width="2" filter="url(#glow)"/><text x="260" y="286" fill="#f0f0f0" font-weight="bold">ox-charlie</text><text x="260" y="302" fill="#8a919b" font-size="10">10.44.0.3</text></g>
    <g><circle cx="520" cy="290" r="34" fill="#0d1017" stroke="#ff6a13" stroke-width="2" filter="url(#glow)"/><text x="520" y="286" fill="#f0f0f0" font-weight="bold">ox-delta</text><text x="520" y="302" fill="#8a919b" font-size="10">10.44.0.4</text></g>
    <g><rect x="720" y="180" width="100" height="60" rx="8" fill="#0d1017" stroke="#33d9ff" stroke-width="1.6" stroke-dasharray="6 5"/><text x="770" y="205" fill="#33d9ff" font-weight="bold">relay</text><text x="770" y="222" fill="#8a919b" font-size="10">optional</text></g>
  </g>
  <!-- legend -->
  <g font-size="11" fill="#e6e6e6">
    <line x1="620" y1="90" x2="660" y2="90" stroke="#ff6a13" stroke-width="1.6"/><text x="668" y="94">wg0 peer tunnel (LAN auto-discovery)</text>
    <line x1="620" y1="112" x2="660" y2="112" stroke="#33d9ff" stroke-width="1.4" stroke-dasharray="6 5"/><text x="668" y="116">optional pre-planned peer / relay</text>
    <text x="620" y="290" fill="#ffb15c" font-weight="bold">sudo orionx-mesh join</text><text x="620" y="308" fill="#8a919b" font-size="10.5">status · peers · leave</text>
  </g>
</svg>
