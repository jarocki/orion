name: Release Pipeline

# @decision DEC-PHASE8-002
# @title Release artifact pipeline: ISO + checksums + GPG signatures + DRAFT GitHub Release
# @status accepted
# @rationale Phase 8 W8-4/W8-5 deliverable. Tag-triggered workflow builds a
#   reproducible ISO inside debian:trixie (same Docker pattern as qemu-test.yml
#   to ensure live-build sees a Debian host), generates SHA-256/SHA-512 checksums,
#   produces detached GPG signatures — these HARD-FAIL if the key is missing,
#   because an unsigned public release is not a releasable artifact — and
#   creates a DRAFT GitHub Release. DRAFT mode is
#   mandatory — the publish flip is the explicit W8-7 operator approve gate.
#
# @decision DEC-PHASE12-115
# @title The release is published as signed split parts staged by one script
# @status accepted
# @rationale Every Trixie image is ~3.1 GB and GitHub rejects release assets
#   over 2 GiB, so `files: output/*.iso` could never upload (packages-build
#   P1-1). scripts/release/stage-split-release.sh is the single authority for
#   the asset set (190 MiB parts, SHA256SUMS/SHA512SUMS over the ISO and every
#   part, detached signatures, REASSEMBLE.txt, and the release body =
#   CHANGELOG section + download/verify instructions); this workflow and the
#   manual path (docs/release-process.md §10) both call it. Also fixed here:
#   the build step pipes into tee, so it now runs under `set -o pipefail`
#   (P2-5); "Verify ISO artifact" checks the exact expected file name; the
#   unreachable "Report signing status" branch is gone (P3-12; signing is
#   hard-fail); release notes for a tag must exist (F-20), no fallback body;
#   and no asset over 2 GiB can reach the upload step.
#   workflow_dispatch is a BUILD CHECK only: it builds and verifies the ISO
#   and keeps it as an Actions artifact. Releases come only from v* tags.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build, sign, and draft release
    runs-on: ubuntu-latest
    # ISO build + staging + signing + upload. Mirrors qemu-test.yml's budget.
    timeout-minutes: 60

    permissions:
      # Required for softprops/action-gh-release to create releases
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so CHANGELOG.md and git describe work on tag events.
          fetch-depth: 0

      # The version decides the ISO file name, so it is fixed once, here.
      # Tag push: the tag (build-iso.sh refuses it without a CHANGELOG section,
      # DEC-PHASE12-114). Dispatch: a development name, never release-looking.
      - name: Resolve build version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "ORIONX_VERSION=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"
          else
            echo "ORIONX_VERSION=dev-dispatch-${GITHUB_RUN_ID}" >> "${GITHUB_ENV}"
          fi

      - name: Build ISO in debian:trixie container
        run: |
          set -o pipefail
          mkdir -p tmp output
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e "ORIONX_VERSION=${ORIONX_VERSION}" \
            debian:trixie-slim \
            bash -c '
              set -e
              apt-get update -q
              apt-get install -y -q --no-install-recommends \
                live-build debootstrap xorriso isolinux \
                ca-certificates wget gnupg python3 git \
                squashfs-tools rsync cpio
              # The workspace is owned by the runner uid, not root: without this
              # git refuses it ("dubious ownership") and /etc/orionx-version
              # bakes GIT_HEAD_SHA=unknown (content-presence 31b/34g).
              git config --global --add safe.directory /workspace
              bash scripts/build-iso.sh
            ' 2>&1 | tee tmp/release-build-iso.log

      # Container ran as root (--privileged); chown back to runner so
      # subsequent steps can read/write output/ and tmp/ normally.
      - name: Restore workspace ownership to runner
        run: |
          sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}"

      - name: Verify ISO artifact
        run: |
          ISO="output/orionx-phoenix-edition-${ORIONX_VERSION}.iso"
          if [[ ! -f "${ISO}" || ! -f "${ISO}.sha256" ]]; then
            echo "ERROR: ${ISO} (+ .sha256) not produced by this build." >&2
            ls -l output/ >&2 || true
            exit 1
          fi
          (cd output && sha256sum -c "$(basename "${ISO}").sha256")
          echo "ISO=${ISO}" >> "${GITHUB_ENV}"

      # These steps deliberately DO NOT set continue-on-error (DEC-PHASE12-026).
      # An unsigned public release cannot be produced by accident. If import
      # fails, provision GPG_PRIVATE_KEY and GPG_PASSPHRASE in repository
      # secrets — do not re-add continue-on-error.
      #
      # Signing identity (publish this fingerprint anywhere users can check it
      # independently of this repository):
      #   4CB08BD1D0B3281613DD15DB1DCCDF47FEEDEEEF
      #   John Jarocki <john@jarocki.org>  ed25519, expires 2027-09-28
      - name: Import GPG signing key
        if: startsWith(github.ref, 'refs/tags/v')
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # Splits into 190 MiB parts, writes SHA256SUMS/SHA512SUMS (whole ISO +
      # every part), signs both, renders REASSEMBLE.txt and RELEASE-NOTES.md
      # (CHANGELOG section + download/verify instructions), and verifies all
      # of it before returning. It fails if the tag has no CHANGELOG section.
      - name: Stage signed split release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ORIONX_GPG_EXTRA_ARGS: --pinentry-mode loopback
        run: |
          bash scripts/release/stage-split-release.sh "${ISO}" "${GITHUB_REF_NAME}" --out output/release

      - name: Assert every release asset is under GitHub's 2 GiB cap
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          over="$(find output/release -type f -size +2097151k)"
          if [[ -n "${over}" ]]; then
            echo "ERROR: assets at or over 2 GiB: ${over}" >&2
            exit 1
          fi
          ls -l output/release

      # DRAFT mode is non-negotiable — W8-7 operator publish flip is the
      # explicit approve gate. prerelease: auto-flagged for -rc/-beta/-alpha.
      # Every listed file must exist (fail_on_unmatched_files: true).
      - name: Create DRAFT GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          body_path: output/release/RELEASE-NOTES.md
          files: |
            output/release/*.iso.part-*
            output/release/SHA256SUMS
            output/release/SHA256SUMS.asc
            output/release/SHA512SUMS
            output/release/SHA512SUMS.asc
            output/release/REASSEMBLE.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts to Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.run_id }}
          path: |
            output/*.iso
            output/*.iso.sha256
            output/release/SHA256SUMS*
            output/release/SHA512SUMS*
            output/release/REASSEMBLE.txt
            output/release/RELEASE-NOTES.md
            tmp/release-build-iso.log
          if-no-files-found: warn

      - name: Release summary
        if: always()
        run: |
          echo "=== Release Pipeline Summary ==="
          echo "Ref:      ${GITHUB_REF_NAME}"
          echo "Version:  ${ORIONX_VERSION:-unresolved}"
          ls -lh output/ output/release/ 2>/dev/null || echo "(no output)"
