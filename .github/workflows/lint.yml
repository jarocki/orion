name: Lint & Test

on:
  push:
    branches: [develop, 'release/**']
  pull_request:
    branches: [develop, 'release/**']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shell and ISO test tools
        run: sudo apt-get install -y shellcheck xorriso squashfs-tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python tools
        # Match the validated local linter until existing scripts are migrated
        # to newer Ruff rules; an unpinned upgrade broke unrelated v3.0.0 code.
        run: pip install ruff==0.15.12 pytest pyyaml

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test-unit
