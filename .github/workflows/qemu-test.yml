name: QEMU Boot Test

# @decision DEC-PHASE7-021
# @title KVM-when-available, TCG-fallback, 300s default timeout
# @status accepted
# @rationale ubuntu-latest runners expose /dev/kvm on larger SKUs but not
#   every job. The harness detects /dev/kvm at runtime and falls back to
#   TCG (-accel tcg -cpu max) automatically. Workflow stays green on any
#   ubuntu-latest SKU. timeout-minutes: 30 covers iso-build (~10-15min) +
#   two boot cycles at TCG speeds (~5-9min each) with headroom.
#
# @decision DEC-PHASE7-019
# @title OVMF resolution order with explicit SKIP on missing firmware
# @status accepted
# @rationale This workflow installs the `ovmf` package (Debian/Ubuntu) so
#   OVMF_CODE.fd lands at /usr/share/OVMF/OVMF_CODE.fd — the first path in
#   the harness search order. The harness itself never re-implements resolution;
#   CI only ensures the package is present.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  qemu-boot:
    runs-on: ubuntu-latest
    # Bumped from 30 → 60 minutes: TCG-mode boot under --timeout 900
    # for both BIOS and UEFI may consume up to ~30 min total in worst case
    # (no KVM on standard ubuntu-latest), plus ~10-15 min ISO build.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 ovmf

      - name: Show QEMU and OVMF versions
        run: |
          qemu-system-x86_64 --version
          ls -lh /usr/share/OVMF/OVMF_CODE.fd 2>/dev/null || echo "OVMF_CODE.fd not at expected path"

      # Issue #28: Ubuntu's ovmf package may install firmware at non-Debian
      # paths (e.g., /usr/share/OVMF/OVMF_CODE_4M.fd or with .ms suffixes).
      # Detect the actual file via dpkg -L and export OVMF_PATH for use as
      # the harness's --ovmf override. Falls back to empty if package missing.
      - name: Detect OVMF firmware path
        id: ovmf
        run: |
          OVMF_PATH=$(dpkg -L ovmf 2>/dev/null \
            | grep -E '/OVMF_CODE.*\.fd$' \
            | grep -v '\.ms\.fd$' \
            | head -1 || true)
          if [[ -z "${OVMF_PATH}" ]]; then
            OVMF_PATH=$(dpkg -L ovmf 2>/dev/null \
              | grep -E '/OVMF.*\.fd$' \
              | head -1 || true)
          fi
          echo "Detected OVMF_PATH: ${OVMF_PATH:-<not found>}"
          echo "ovmf_path=${OVMF_PATH}" >> "${GITHUB_OUTPUT}"

      # KVM availability: ubuntu-latest exposes /dev/kvm on larger SKUs.
      # The harness detects this automatically; this step just logs the state.
      - name: Check KVM availability
        run: |
          if [ -r /dev/kvm ]; then
            echo "KVM: available (/dev/kvm readable)"
          else
            echo "KVM: unavailable — harness will use TCG fallback (slower)"
          fi

      - name: Set up Python (for iso-build pre-checks)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install --quiet -r requirements.txt

      # Build the ISO inside a debian:bullseye container so live-build sees a
      # Debian host and bootstraps from deb.debian.org/bullseye, not from
      # archive.ubuntu.com/precise. Issue #25: ubuntu-latest runners' live-build
      # autodetects host distro and overrides --mode debian / --distribution
      # bullseye in iso/auto/config, attempting to bootstrap Ubuntu instead.
      # Running build-iso.sh inside debian:bullseye-slim with --privileged
      # (needed for chroot operations) sidesteps the host detection entirely.
      # The resulting ISO is written to ${{ github.workspace }}/output/ via
      # the bind mount, so the host runner's QEMU step finds it normally.
      - name: Build ISO in debian:bullseye container (W7-1 deliverable, issue #25)
        run: |
          mkdir -p tmp
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            debian:bullseye-slim \
            bash -c '
              set -e
              apt-get update -q
              apt-get install -y -q --no-install-recommends \
                live-build debootstrap xorriso isolinux \
                ca-certificates wget gnupg python3 \
                squashfs-tools rsync cpio
              bash scripts/build-iso.sh
            ' 2>&1 | tee tmp/build-iso.log

      # Container ran as root (--privileged) so output/, tmp/, and any
      # other build artifacts are root-owned on the bind mount. The host
      # runner runs as the unprivileged `runner` user; without chown, the
      # QEMU harness step fails to create new files under tmp/qemu-artifacts/
      # ("Could not open '.../serial-bios.log': No such file or directory").
      # Chown the workspace back to the runner so the rest of the workflow
      # can write artifacts normally.
      - name: Restore workspace ownership to runner
        run: |
          sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}"

      - name: Validate project hooks executed during ISO build (#32)
        run: |
          BUILD_LOG=tmp/build-iso.log bash tests/integration/test-iso-hooks-applied.sh

      # Issue #27: ubuntu-latest runners typically don't expose /dev/kvm.
      # TCG emulation of full ISO boot to multi-user.target is much slower
      # than KVM (~5-10 min vs ~30s). Bumping --timeout to 900 gives TCG
      # headroom while still failing fast on a genuinely stuck boot.
      # Issue #28: pass --ovmf with the dpkg-detected path so UEFI mode
      # finds firmware regardless of Ubuntu's package layout differences
      # from Debian. Empty OVMF_PATH falls back to the harness's default
      # search order and emits the canonical SKIP — never a silent pass.
      - name: Run QEMU boot test (BIOS + UEFI)
        run: |
          OVMF_FLAG=""
          if [[ -n "${{ steps.ovmf.outputs.ovmf_path }}" ]]; then
            OVMF_FLAG="--ovmf ${{ steps.ovmf.outputs.ovmf_path }}"
          fi
          bash scripts/qemu-boot-test.sh \
            --mode both \
            --timeout 900 \
            ${OVMF_FLAG}

      # W7-4-B: Run in-guest runtime verification (mesh + Matrix + AppArmor).
      # Boots the ISO a second time in BIOS mode and waits for the
      # orionx-runtime-verify.service sentinels on /dev/ttyS0. Uses the same
      # --post-boot-script attach point declared in DEC-PHASE7-022. Runs
      # after the BIOS+UEFI boot test so the ISO artefact is already proven
      # to boot before we spend 900s verifying runtime state.
      # timeout-minutes is set on the job (60min); this step uses --timeout 900
      # which matches the BIOS+UEFI step and fits within the job budget.
      - name: Run W7-4-B runtime verification (mesh + Matrix + AppArmor)
        continue-on-error: true
        run: |
          OVMF_FLAG=""
          if [[ -n "${{ steps.ovmf.outputs.ovmf_path }}" ]]; then
            OVMF_FLAG="--ovmf ${{ steps.ovmf.outputs.ovmf_path }}"
          fi
          bash tests/integration/test-w7-4-b-runtime-verify.sh \
            --mode bios \
            ${OVMF_FLAG}
        env:
          QEMU_TIMEOUT: "900"
          VERIFY_WAIT: "120"

      # W7-5: Run in-guest performance benchmark (boot <90s, ISO <4GiB, idle RAM <1GiB).
      # Boots the ISO a third time in BIOS mode and waits for the
      # orionx-perf-measure.service sentinels on /dev/ttyS0. Measures ISO
      # size host-side via du -b. Uses the same --post-boot-script attach
      # point declared in DEC-PHASE7-022. Runs after W7-4-B so the ISO is
      # already proven to boot before we spend 900s on performance measurement.
      #
      # continue-on-error: true mirrors W7-4-B-exit (DEC-PHASE7-041).
      # The ISO size assertion (host-side, deterministic) is the de facto
      # gate; boot_time/idle_ram in-guest measurements remain as diagnostic
      # captures (tracked under issue #40 for reliability improvements).
      # See DEC-PHASE7-035 for the sentinel-channel design.
      - name: Run W7-5 performance benchmark (boot/ISO/RAM thresholds)
        continue-on-error: true
        run: |
          OVMF_FLAG=""
          if [[ -n "${{ steps.ovmf.outputs.ovmf_path }}" ]]; then
            OVMF_FLAG="--ovmf ${{ steps.ovmf.outputs.ovmf_path }}"
          fi
          bash tests/integration/test-w7-5-performance.sh \
            --mode bios \
            ${OVMF_FLAG}
        env:
          QEMU_TIMEOUT: "900"
          PERF_WAIT: "90"

      # W7-6: Run host-side failure-resilience config inspection.
      # Reads each of the 8 Orion-X systemd unit files from systemd/ and
      # asserts per-Type recovery configuration:
      #   - Long-running daemons (Type=notify, Type=simple) must declare
      #     Restart= with on-failure|always|on-abnormal.
      #   - Oneshot units are recovery-irrelevant by design (timer-driven).
      #   - Timer units must declare OnUnitActiveSec= or OnBootSec=.
      # Option D (host-side static inspection) — no QEMU boot, no hang risk.
      # NO continue-on-error: deterministic static check, active gate.
      # Runs after W7-5 so all prior boot-dependent steps are already done.
      - name: Run W7-6 failure-resilience config check
        run: |
          bash tests/integration/test-w7-6-failure-resilience.sh

      - name: Upload QEMU artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-artifacts-${{ github.run_id }}
          path: tmp/qemu-artifacts/
          if-no-files-found: warn

      - name: Upload W7-4-B verification artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: w7-4-b-verify-artifacts-${{ github.run_id }}
          path: |
            tmp/qemu-artifacts/
            tmp/w7-4-b-post-boot-helper.sh
          if-no-files-found: warn

      - name: Upload W7-5 performance artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: w7-5-perf-artifacts-${{ github.run_id }}
          path: |
            tmp/qemu-artifacts/
            tmp/w7-5-post-boot-helper.sh
          if-no-files-found: warn
