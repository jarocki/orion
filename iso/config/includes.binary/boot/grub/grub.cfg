# Orion-X Phoenix Edition — grub.cfg with serial console (#35 W7-3 fix)
#
# Pre-baked via iso/config/includes.binary/ — see DEC-PHASE7-024.
# live-build's lb_binary_local-includes copies this into binary/boot/grub/grub.cfg,
# overriding whatever lb_binary_grub_efi generated.
#
# @decision DEC-PHASE7-024
# @title Pre-baked bootloader configs via includes.binary/ (W7-3-FIX-15)
# @status accepted
# @rationale See iso/config/includes.binary/isolinux/isolinux.cfg for full
#   rationale. GRUB serial setup: serial initialises COM1 at 115200 8N1;
#   terminal_input/output --append serial adds serial I/O without displacing
#   the default VGA console, so human users at physical hardware still get
#   a working GRUB menu on screen. References: issue #35, W7-3-FIX-15.
#
# DUAL AUTHORITY WARNING (DEC-PHASE10-018):
# This file is the EFFECTIVE kernel cmdline authority for UEFI boots.
# iso/auto/config --bootappend-live is generated into a bootloader cfg by
# live-build, but lb_binary_local-includes overwrites it with THIS file.
# Keep --bootappend-live and this file in sync until issue #64 consolidates
# to a single authority in v2.1. Current canonical tokens MUST match across:
#   iso/auto/config (--bootappend-live)
#   iso/config/includes.binary/isolinux/isolinux.cfg (both labels)
#   iso/config/includes.binary/boot/grub/grub.cfg (this file, both menuentry blocks)
# Regression guards: tests/unit/test_iso_serial_console.sh T3, T4, T16, T17.
#
# Active kernel cmdline (Orion-X Live menuentry, default):
#   boot=live components splash quiet persistence
#   console=tty0 console=ttyS0,115200n8
#   live-config.username=orionx live-config.hostname=orionx-cyberdeck
#
# set timeout=1: auto-boot after 1 second with no input.
# set default=0: boot the first menuentry (Orion-X Live).

serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input --append serial
terminal_output --append serial

set timeout=1
set default=0

menuentry "Orion-X Live" {
    linux /live/vmlinuz boot=live components splash quiet persistence console=tty0 console=ttyS0,115200n8 live-config.username=orionx live-config.hostname=orionx-cyberdeck
    initrd /live/initrd.img
}

menuentry "Orion-X Live (failsafe)" {
    linux /live/vmlinuz boot=live components nosplash text noapic noapm nodma nomce nosmp nolapic console=tty0 console=ttyS0,115200n8 live-config.username=orionx live-config.hostname=orionx-cyberdeck
    initrd /live/initrd.img
}
