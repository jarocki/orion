# Orion-X Phoenix Edition — isolinux.cfg with serial console (#35 W7-3 fix)
#
# Pre-baked via iso/config/includes.binary/ since binary_hooks stage runs
# before live-build's bootloader generation. live-build's lb_binary_local-includes
# stage copies this file into binary/isolinux/isolinux.cfg, overriding whatever
# live-build would have produced.
#
# @decision DEC-PHASE7-024
# @title Pre-baked bootloader configs via includes.binary/ (W7-3-FIX-15)
# @status accepted
# @rationale Hook-based patching (0500-bootloader-serial.hook.binary) cannot
#   reliably intercept live-build's isolinux.cfg/grub.cfg because binary_hooks
#   run before lb_binary_syslinux generates those files in some live-build
#   versions. Using iso/config/includes.binary/ guarantees the serial-enabled
#   configs land at the correct path: lb_binary_local-includes runs AFTER
#   lb_binary_syslinux and copies these files on top of whatever was generated.
#   The hook is kept as defense-in-depth (it will NOOP when serial is already
#   present). References: issue #35, W7-3-FIX-15, DEC-PHASE7-023.
#
# DUAL AUTHORITY WARNING (DEC-PHASE10-018):
# This file is the EFFECTIVE kernel cmdline authority for BIOS boots.
# iso/auto/config --bootappend-live is generated into a bootloader cfg by
# live-build, but lb_binary_local-includes overwrites it with THIS file.
# Keep --bootappend-live and this file in sync until issue #64 consolidates
# to a single authority in v2.1. Current canonical tokens MUST match across:
#   iso/auto/config (--bootappend-live)
#   iso/config/includes.binary/isolinux/isolinux.cfg (this file, both labels)
#   iso/config/includes.binary/boot/grub/grub.cfg (both menuentry blocks)
# Regression guards: tests/unit/test_iso_serial_console.sh T3, T4, T16, T17.
#
# Active kernel cmdline (live label, default):
#   boot=live components splash quiet persistence
#   console=tty0 console=ttyS0,115200n8
#   live-config.username=orionx live-config.hostname=orionx-cyberdeck
#
# timeout: units are 1/10th second. timeout 10 = 1.0 second before auto-boot.
# prompt 0: do not prompt for user input (auto-boot after timeout).

serial 0 115200
default live
timeout 10
prompt 0

label live
    menu label Orion-X Live
    kernel /live/vmlinuz
    initrd /live/initrd.img
    append boot=live components splash quiet persistence console=tty0 console=ttyS0,115200n8 live-config.username=orionx live-config.hostname=orionx-cyberdeck

label live-failsafe
    menu label Orion-X Live (failsafe)
    kernel /live/vmlinuz
    initrd /live/initrd.img
    append boot=live components nosplash text noapic noapm nodma nomce nosmp nolapic console=tty0 console=ttyS0,115200n8 live-config.username=orionx live-config.hostname=orionx-cyberdeck
