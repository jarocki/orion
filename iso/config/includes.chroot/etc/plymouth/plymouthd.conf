# /etc/plymouth/plymouthd.conf — Orion-X Phoenix Edition Plymouth configuration
#
# @decision DEC-PHASE11-010
# @title W11-9a: plymouthd.conf sets orionx-phoenix as default theme
# @status accepted
# @rationale Belt-and-suspenders alongside `plymouth-set-default-theme -R
#   orionx-phoenix` in 0800-orionx-branding.hook.chroot. The hook call
#   writes the theme to Plymouth's own state directory; this file makes the
#   selection inspectable and declarative in the source tree.
#   Theme= value must match the directory name under
#   /usr/share/plymouth/themes/ and the [Plymouth Theme] Name= field is
#   informational only — Plymouth matches on directory name.
#
# SINGLE AUTHORITY: this file is the configuration authority for the Plymouth
# theme selection. Do NOT duplicate Theme= in any other configuration file.
# W11-9b does not change this file. If the theme must change (e.g., a
# fully-animated replacement), amend this file and the hook in the same commit.

[Daemon]
Theme=orionx-phoenix
ShowDelay=0
DeviceTimeout=8
