# Orion-X Phoenix Edition — LightDM autologin configuration
#
# @decision DEC-PHASE9-005
# @title LightDM autologin for orionx live user
# @status accepted
# @rationale rc3 required manual login at the LightDM greeter, making the
#   cyberdeck unusable in the field (delays boot-to-desktop by a greeter
#   interaction). The live user is passwordless (live-config 0080-user-setup
#   creates the user with an empty password), so autologin adds no credential
#   risk beyond what the passwordless account already exposes.
#   Security tradeoff: physical access to the running system grants a desktop
#   session without any additional authentication. This is acceptable for a
#   live/forensic cyberdeck that boots from USB — the attacker with physical
#   access to the USB can already boot arbitrary systems. The ISO is not
#   intended for use as a persistent multi-user system where session isolation
#   matters. If the device is used in a higher-sensitivity context, the operator
#   should remove this file from the ISO configuration.
#   Debian LightDM autologin does NOT require the user to be in an 'autologin'
#   group for the greeter itself; the greeter config below is sufficient.
#   PAM: Debian's lightdm PAM stack allows autologin for users with no password
#   (pam_unix.so with nullok). No extra PAM configuration is needed.
#   Authority: this file at /etc/lightdm/lightdm.conf.d/10-orionx-autologin.conf
#   is the SINGLE authority for autologin configuration. Do NOT duplicate in
#   /etc/lightdm/lightdm.conf (that file is managed by the lightdm package).
#
# @decision DEC-PHASE11-012 identity reference (W11-9b T6 alignment)
# @title autologin-user identity derived from DEC-PHASE11-012 single-authority
# @status accepted
# @rationale The value 'orionx-operator' is NOT chosen here independently —
#   it is consumed from the canonical identity authority at
#   iso/auto/config --bootappend-live live-config.username=orionx-operator
#   (DEC-PHASE11-012, W11-2, 2026-07-05). The W11-9b T6 change corrects the
#   prior mismatch where this file still named 'orionx' while the bootloader
#   had already been updated to 'orionx-operator'. The correction aligns this
#   file to the live canonical identity so LightDM autologins to the user that
#   live-config actually creates. No dual-authority introduced: DEC-PHASE9-005
#   (this file) remains the single autologin config authority; DEC-PHASE11-012
#   (iso/auto/config) is the single identity-value authority; this file consumes
#   that value. (R6 fix byproduct: prior autologin mismatch contributed to the
#   dead-authority state that caused the 2026-07-13 hardware boot to show
#   default Debian XFCE, as the session landed with no xfconf defaults seeded.)

[Seat:*]
autologin-user=orionx-operator
autologin-user-timeout=0
