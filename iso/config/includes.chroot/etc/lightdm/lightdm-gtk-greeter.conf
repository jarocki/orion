# /etc/lightdm/lightdm-gtk-greeter.conf — Orion-X Phoenix Edition LightDM greeter
#
# @decision DEC-PHASE11-010
# @title W11-9b LANDED: LightDM greeter upgraded to Orion-X-Cyberdeck / Orion-X-Icons / Iosevka 11
# @status accepted
# @rationale W11-9a shipped transitional values (Adwaita-dark, Adwaita, Sans 11).
#   W11-9b replaces all three with the Orion-X-Cyberdeck identity stack:
#   - theme-name: Orion-X-Cyberdeck (GTK3 dark + Phoenix red-orange accent,
#     staged at /usr/share/themes/Orion-X-Cyberdeck/ by W11-9b)
#   - icon-theme-name: Orion-X-Icons (Papirus-Dark inheritance, staged at
#     /usr/share/icons/Orion-X-Icons/ by W11-9b; papirus-icon-theme package
#     provides the Papirus-Dark fallback tree)
#   - font-name: Iosevka 11 (OFL-1.1, fonts-iosevka Debian package per
#     DEC-PHASE11-013; community-developed fonts only per operator directive 2026-07-13)
#
# SINGLE AUTHORITY: This file is the SINGLE authority for lightdm-gtk-greeter
# configuration. Do NOT duplicate [greeter] settings in lightdm.conf or any
# drop-in under /etc/lightdm/lightdm.conf.d/.
# The autologin authority is /etc/lightdm/lightdm.conf.d/10-orionx-autologin.conf
# (DEC-PHASE9-005) — that file is separate and updated by W11-9b T6.
#
# WALLPAPER PATH (greeter): /opt/orionx/theme/wallpapers/orionx-wp-badge.png
#   is populated at ISO build time by stage_application_content() via rsync
#   from theme/wallpapers/. At live-session startup this path is available
#   in the squashfs root. If the wallpaper is absent (build regression),
#   LightDM falls back to the default GTK theme background; it does NOT crash.
#
# @decision DEC-PHASE11-028
# @title Greeter background split from desktop wallpaper (operator choice 2026-09-09)
# @status accepted
# @rationale The operator selected two distinct Phoenix-Edition artworks:
#   - DESKTOP  → orionx-phoenix-wallpaper.png (the "wide" circuit-bg firebird,
#     lots of dark negative space so icons/windows stay readable). That canonical
#     filename remains the SINGLE authority for the desktop backdrop domain
#     (skel xfconf seed in hooks/normal/0100-create-user.hook.chroot +
#     the XDG autostart re-assert orionx-wallpaper.desktop, DEC-PHASE11-017).
#   - GREETER  → orionx-wp-badge.png (the "ORION-X PHOENIX EDITION" hero badge),
#     which reads best as a full-screen login statement rather than behind windows.
#   These are two separate state domains, each with one authority — the
#   single-source-of-truth invariant (DEC-PHASE9-002) is preserved, not broken.
#   The named palette orionx-wp-{wide,badge,circle,neon,neonlogin}.png ships
#   alongside so either surface can be re-pointed without regenerating assets.
#   Source artwork operator-provided 2026-09-09 (supersedes the hand-vectored
#   placeholder wallpaper).

[greeter]
background=/opt/orionx/theme/wallpapers/orionx-wp-badge.png
theme-name=Orion-X-Cyberdeck
icon-theme-name=Orion-X-Icons
font-name=Hack 11
xft-hintstyle=hintslight
xft-rgba=rgb
indicators=~spacer;~clock;~spacer;~host;~spacer;~session;~language;~a11y;~power
clock-format=%H:%M — %a %d %b
