# /etc/lightdm/lightdm-gtk-greeter.conf — Orion-X Phoenix Edition LightDM greeter
#
# @decision DEC-PHASE11-010
# @title W11-9a: LightDM greeter wired to Phoenix wallpaper + transitional GTK theme
# @status accepted
# @rationale W11-9a ships the greeter config with:
#   - background: Phoenix wallpaper (W9-1 source authority, staged by
#     stage_application_content() to /opt/orionx/theme/wallpapers/)
#   - theme-name: Adwaita-dark (transitional; W11-9b replaces with Orion-X-Cyberdeck)
#   - icon-theme-name: Adwaita (transitional; W11-9b replaces with Orion-X-Icons)
#   - font-name: Sans 11 (transitional; W11-9b replaces with Iosevka 11)
#
# SINGLE AUTHORITY: This file is the SINGLE authority for lightdm-gtk-greeter
# configuration. Do NOT duplicate [greeter] settings in lightdm.conf or any
# drop-in under /etc/lightdm/lightdm.conf.d/.
# The autologin authority is /etc/lightdm/lightdm.conf.d/10-orionx-autologin.conf
# (DEC-PHASE9-005) — that file is separate and untouched by W11-9a.
#
# WALLPAPER PATH: /opt/orionx/theme/wallpapers/orionx-phoenix-wallpaper.png
#   is populated at ISO build time by stage_application_content() via rsync
#   from theme/wallpapers/. At live-session startup this path is available
#   in the squashfs root. If the wallpaper is absent (build regression),
#   LightDM falls back to the default GTK theme background; it does NOT crash.
#
# W11-9b UPGRADE TARGETS in this file:
#   theme-name=Adwaita-dark         → Orion-X-Cyberdeck
#   icon-theme-name=Adwaita         → Orion-X-Icons
#   font-name=Sans 11               → Iosevka 11

[greeter]
background=/opt/orionx/theme/wallpapers/orionx-phoenix-wallpaper.png
theme-name=Adwaita-dark
icon-theme-name=Adwaita
font-name=Sans 11
xft-hintstyle=hintslight
xft-rgba=rgb
indicators=~spacer;~clock;~spacer;~host;~spacer;~session;~language;~a11y;~power
clock-format=%H:%M — %a %d %b
