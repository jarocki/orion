#!/usr/sbin/nft -f
# Orion-X Phoenix Edition — Firewall Configuration
#
# @decision DEC-SEC-001
# @title nftables over iptables/ufw for firewall
# @status accepted
# @rationale Debian Bullseye default, kernel-native, cleaner syntax.

flush ruleset

table inet orionx_firewall {
    chain input {
        type filter hook input priority 0; policy drop;

        # Allow established and related connections
        ct state established,related accept

        # Allow loopback
        iif "lo" accept

        # Allow ICMP (needed for mesh health checks)
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # WireGuard mesh (51820/udp)
        udp dport 51820 accept

        # Mesh discovery broadcast (55555/udp, link-local only)
        udp dport 55555 accept

        # Matrix/Synapse (8448/tcp — federation, 8008/tcp — client API)
        tcp dport { 8008, 8448 } accept

        # SSH (optional — can be disabled in first-boot wizard)
        tcp dport 22 accept

        # Log and drop everything else
        log prefix "[ORIONX-DROP] " drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
        # No forwarding by default
    }

    chain output {
        type filter hook output priority 0; policy accept;
        # Allow all outbound (WireGuard, DNS, etc.)
    }
}
