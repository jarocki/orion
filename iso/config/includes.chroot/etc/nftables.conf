#!/usr/sbin/nft -f
# Orion-X Phoenix Edition — Firewall Configuration
#
# @decision DEC-SEC-001
# @title nftables over iptables/ufw for firewall
# @status accepted
# @rationale Kernel-native, cleaner syntax.
#
# @decision DEC-PHASE12-104
# @title The hostile LAN gets only replies, DHCP, WireGuard and (rate-limited)
#   discovery; everything that is a service is reachable over wg0 only; this
#   file owns its own table and nothing else
# @status accepted
# @rationale Before (security F1/F15/F26, system P2-3): 22, 8008, 8448 and
#   55555 were accepted on EVERY interface (the "link-local only" comment on
#   55555 was false: the rule had no scope at all), all ICMP types were
#   accepted from anywhere, and the file began with `flush ruleset`, so
#   reloading or stopping orionx-firewall wiped heald's block/isolate tables
#   and postured's tables too.
#   Now, on any interface other than lo/wg0: established/related, DHCP
#   client replies, WireGuard 51820/udp and mesh discovery 55555/udp
#   (rate-limited; beacons are also validated, DEC-PHASE12-096). ICMP: only
#   the error/PMTU types IPv4 needs and the ICMPv6 neighbour-discovery types
#   IPv6 cannot work without; echo-request only on wg0 (mesh health checks).
#   On wg0 (authenticated WireGuard peers): SSH 22, Matrix 8008/8448.
#   sshd is installed but NOT enabled at boot (0620-service-hardening,
#   DEC-PHASE12-104): the operator starts it deliberately.
#   Table handling: `table inet orionx_firewall` + `delete table` + redefine
#   is the idempotent nft idiom — it replaces THIS table atomically and
#   leaves every other table alone.
#   Verified with `nft -c -f` (nftables in debian:trixie-slim).

table inet orionx_firewall
delete table inet orionx_firewall

table inet orionx_firewall {
    chain input {
        type filter hook input priority 0; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif "lo" accept

        # --- Mesh peers (WireGuard-authenticated) ---
        iifname "wg0" icmp type echo-request accept
        iifname "wg0" icmpv6 type echo-request accept
        iifname "wg0" tcp dport 22 accept
        iifname "wg0" tcp dport { 8008, 8448 } accept

        # --- Every interface (the LAN is assumed hostile) ---
        # ICMP errors / PMTU discovery (replies to our own traffic are already
        # covered by established,related; these cover the unsolicited ones).
        icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
        # IPv6 cannot function without neighbour discovery and PMTU.
        icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
        # DHCP client: server replies arrive as new flows to 68/udp (v4) and 546/udp (v6).
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept
        # WireGuard mesh transport.
        udp dport 51820 accept
        # Mesh discovery beacons (broadcast on the LAN by design), rate-limited.
        udp dport 55555 limit rate 20/second burst 40 packets accept
        udp dport 55555 drop

        # Log and drop everything else
        log prefix "[ORIONX-DROP] " drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
        # No forwarding by default
    }

    chain output {
        type filter hook output priority 0; policy accept;
        # Allow all outbound (WireGuard, DNS, etc.)
    }
}
