# Orion-X hardening for the matrix.org package's own matrix-synapse.service
#
# @decision DEC-PHASE12-102
# @title matrix-synapse.service (the package unit) is the ONE Synapse unit;
#   Orion-X hardens it with this drop-in and ships no AppArmor profile for it
# @status accepted
# @rationale Two Synapse unit authorities existed (system P1-2, security F9):
#   the shipped matrix-synapse-orionx.service, which 0615 never installed, and
#   the package's matrix-synapse.service, which setup-matrix.sh actually
#   started. The Cockpit, state_polling and runtime-verify watched the one
#   that did not exist, so Comms showed "inactive" for a running homeserver,
#   and the reviewed hardening applied to nothing. The lead chose the package
#   unit; the orionx unit is deleted and its hardening moved here. ExecStart
#   is NOT overridden: the package's own ExecStartPre (--generate-keys) and
#   ExecStart already use /opt/venvs/matrix-synapse/bin/python and read
#   homeserver.yaml + conf.d/ (verified against matrix-synapse-py3
#   1.162.0+trixie1 from packages.matrix.org, 2026-10-07).
#
#   AppArmor: the old `profile synapse /usr/bin/python3` never attached
#   (/usr/bin/python3 is a symlink; AppArmor attaches on the resolved path).
#   It cannot be fixed by attachment either: in the package,
#   /opt/venvs/matrix-synapse/bin/python -> python3.13 -> /usr/bin/python3.13,
#   the same file every Python program on the deck executes, so any
#   attachment that matched Synapse would confine the Cockpit, postured,
#   heald and R.A.I.N. as "synapse" (system P2-6). The profile is removed
#   rather than shipped dead; Synapse's confinement is this systemd sandbox.
#   `aa-status` will not list synapse, and the docs must not claim it does.
#
#   Paths: /etc/matrix-synapse is writable because the package's
#   ExecStartPre writes homeserver.signing.key there (signing_key_path in the
#   package homeserver.yaml). The `-` prefixes keep a missing directory from
#   failing the unit with 226/NAMESPACE.
#   Verified: `systemctl show` lists this drop-in and the package ExecStart
#   under systemd 257. NOT verified: that Synapse starts under this sandbox
#   (emulated systemd in the QA container could not spawn any unit) or on a
#   deck. Check on a deck: systemctl status matrix-synapse; ss -ltnp | grep 8008.
[Unit]
After=network-online.target
Wants=network-online.target

[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
SystemCallArchitectures=native
CapabilityBoundingSet=
AmbientCapabilities=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
ReadWritePaths=-/var/lib/matrix-synapse -/var/log/matrix-synapse -/etc/matrix-synapse
