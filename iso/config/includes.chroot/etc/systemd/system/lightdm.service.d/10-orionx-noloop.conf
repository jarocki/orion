# Orion-X Phoenix Edition — bound lightdm restart so a persistent X failure
# drops the operator to a usable text console instead of an unrecoverable loop.
#
# @decision DEC-PHASE11-023
# @rationale The packaged lightdm.service uses Restart=always with the systemd
#   default StartLimit (5 starts / 10s). A failing X restart cycle takes ~3s, so
#   5 attempts span >10s, the burst window keeps resetting, and lightdm relaunches
#   FOREVER — the rc1-35 cold-boot "boot loop" with no way in (2026-09-06 hardware
#   session). Root cause is addressed by dropping `splash` (no plymouth DRM-master
#   grab) and taking the first-boot wizard off tty1; this is defense-in-depth:
#   if X ever fails 3x in 90s, stop and leave a console (getty@tty1) + sshd,
#   which is recoverable, instead of a loop that needs a bootloader edit.
[Unit]
StartLimitIntervalSec=90
StartLimitBurst=3
[Service]
Restart=on-failure
