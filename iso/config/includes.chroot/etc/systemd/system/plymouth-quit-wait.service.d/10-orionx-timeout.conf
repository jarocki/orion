# Orion-X Phoenix Edition — bound plymouth-quit-wait so it can never hang boot.
#
# @decision DEC-PHASE11-044
# @title Cap plymouth-quit-wait.service with a start timeout
# @status accepted
# @rationale plymouth-quit-wait.service ("Hold until boot process finishes up")
#   ships with NO timeout: if nothing runs `plymouth quit`, it waits FOREVER and
#   the boot never completes — the 21+ minute hang observed on Bay Trail hardware
#   2026-09-07 that led to plymouth being disabled entirely (DEC-PHASE11-023/025).
#   Re-enabling the orionx-phoenix splash (DEC-PHASE11-044) restores the risk, so
#   we bound it: if plymouth has not quit within TimeoutStartSec, systemd stops
#   the wait and boot proceeds. Worst case is a few extra seconds of splash, not
#   a hang. On a healthy boot the wait completes in ~1s (plymouth-quit.service
#   runs before display-manager; the first-boot wizard also quits plymouth), so
#   this cap only ever fires in the pathological case it exists to defuse.
#   QEMU cannot reproduce the i915 DRM-master behavior, so this guard is the
#   load-bearing protection on real hardware.
[Service]
TimeoutStartSec=25
