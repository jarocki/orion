# Orion-X Phoenix Edition — when the quit-wait cap fires, explain why.
#
# 10-orionx-timeout.conf bounds plymouth-quit-wait.service so it cannot hang
# boot (DEC-PHASE11-044). When that cap fires the boot is already abnormal
# (QEMU UEFI, intermittent, see DEC-PHASE13-028), and the only evidence the
# QEMU harness has is the serial console. Pull in the diagnostics unit so the
# plymouth/getty/DRM state lands on /dev/console at the moment of failure.
# The unit has no [Install] and is never enabled; it runs only from here.
[Unit]
OnFailure=orionx-plymouth-diag.service
