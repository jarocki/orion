# @decision DEC-PHASE12-038
# @title Suricata runs Orion-X's config, and orionx-postured owns its restarts
# @status accepted
# @rationale Debian's unit hardcodes `-c /etc/suricata/suricata.yaml`, so the
#   only way to make it read Orion-X's capture config is to replace ExecStart.
#   The empty assignment is required: systemd appends to Exec* lists unless
#   the list is reset first.
#
#   Restart=no is the load-bearing half. Debian ships Restart=on-failure, and
#   with Suricata exiting 1 on every start (no usable interface) that produced
#   the observed "Start request repeated too quickly" storm, while
#   orionx-postured was separately retrying the same unit. Two components
#   restarting one service is two authorities for one fact (RESILIENCE.md
#   rule 7), and neither could succeed because neither fixed the cause.
#   orionx-postured is now the single authority: it starts Suricata only once
#   an interface is measurably carrying packets, writes the interface list
#   first, makes three bounded attempts (DEC-PHASE12-034), verifies the engine
#   actually attached, and escalates once instead of looping. A crash is
#   picked up by its 30s reassert, so nothing is unattended -- it is just
#   attended by one thing.
#
#   ExecStop/ExecReload are re-pointed because orionx.yaml moves the unix
#   command socket off /var/run (see that file for why). Debian's stock
#   ExecStop would talk to a socket that no longer exists, and
#   `systemctl reload suricata` -- which orionx-freshen-suricata
#   (DEC-PHASE12-039) issues after installing rules -- would silently fail to
#   reach the engine.
[Service]
ExecStart=
ExecStart=/usr/bin/suricata -D -c /etc/suricata/orionx.yaml --af-packet --pidfile /run/suricata.pid
ExecReload=
ExecReload=/usr/bin/suricatasc -c reload-rules /var/lib/suricata/orionx-command.socket
ExecStop=
ExecStop=/usr/bin/suricatasc -c shutdown /var/lib/suricata/orionx-command.socket
Restart=no
