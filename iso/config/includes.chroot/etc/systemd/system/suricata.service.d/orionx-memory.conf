# DEC-PHASE13-044 — memory ceiling for the 2 GB deck (issue #125, W11-6b).
# Full decision block: iso/config/hooks/live/0530-suricata-rules.hook.chroot.
#
# Sizing: /etc/suricata/orionx.yaml caps flow+stream+reassembly+defrag+host at
# 160 MB and runs detect profile low over the 3,233-signature baked subset.
# Measured VmRSS, suricata 7.0.10, trixie container, idle af-packet (2026-11-06):
# 311 MB with one rule, 405 MB with the baked set (detect engine ~95 MB),
# 430 MB with 10 workers. Worst case = 405 + 160 (memcaps full) + 95 (reload
# holds two detect engines) ~ 670 MB; 768M leaves ~100 MB over that and
# 1.2 GB for the rest of a 2 GB deck. PROVISIONAL: confirm on the Lenovo
# before treating as final:
#   systemctl show suricata -p MemoryCurrent      (sample over 10 min at Tier 1)
# Hitting the ceiling kills the engine; orionx-postured's 30 s reassert sees
# the dead unit and announces it (DEC-PHASE12-038) — loud, not silent.
[Service]
MemoryMax=768M
