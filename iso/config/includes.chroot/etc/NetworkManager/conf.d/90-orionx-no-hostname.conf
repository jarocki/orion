# Orion-X: do not announce the deck's hostname in DHCP (security F14).
#
# @decision DEC-PHASE12-104
# The live hostname is fixed ("orionx", iso/auto/config), so every DHCP
# request told the network "an Orion-X deck just joined". These are
# connection DEFAULTS: a connection profile that sets its own value wins, so
# an operator who wants the hostname sent can set it per network
# (nmcli con mod <name> ipv4.dhcp-send-hostname yes).
# MAC randomisation is deliberately NOT set here (captive portals, DHCP
# reservations break); recorded in the QA ledger as a decision for John.
[connection]
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
