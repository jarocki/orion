<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Orion-X Phoenix Edition — Orion Cockpit icon (threat-pressure gauge) -->
  <!-- @decision DEC-PHASE12-127 — distinct glyph for the primary surface (QA UX-44) -->
  <!-- License: GPL-3.0+ (Orion-X project, original work) -->
  <!-- Header kept inside <svg>: gdk-pixbuf only recognizes an SVG whose "<svg" falls in the first 256 bytes (DEC-PHASE13-017). -->
  <!-- @decision DEC-PHASE13-017
       @title Every Orion-X-Icons SVG puts `<svg` in its first 256 bytes;
       header comments go inside the element. The desktop-entry checker
       enforces this for every theme icon and renders through gdk-pixbuf when
       available.
       @status accepted
       @date 2026-10-25
       @category ICONS
       @rationale Root cause of #103, reproduced in the v3.0.0 squashfs: GTK
       found orionx-cockpit/-workbench/-phoenix.svg, but gdk-pixbuf refused
       them ("Unrecognized image file format"). Its SVG loader matches `<svg`
       only within the first 256 bytes, and the header comments put it at
       bytes 265–307. Each variant with `<svg` before byte 256 loaded.
       XML-parse-only tests passed all three. -->
  <circle cx="24" cy="24" r="23" fill="#1a1a1a" stroke="#FF5722" stroke-width="1"/>
  <!-- gauge arc: calm (green), elevated (amber), hostile (red) -->
  <path d="M10 30 A14 14 0 0 1 15.3 14.9" fill="none" stroke="#34ff9e" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M17.6 13.2 A14 14 0 0 1 30.4 13.2" fill="none" stroke="#ffb15c" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M32.7 14.9 A14 14 0 0 1 38 30" fill="none" stroke="#FF5722" stroke-width="3.5" stroke-linecap="round"/>
  <!-- needle -->
  <line x1="24" y1="29" x2="31" y2="17" stroke="#e6e6e6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="24" cy="29" r="2.6" fill="#FF5722" stroke="#1a1a1a" stroke-width="1"/>
  <!-- event-stream bar under the gauge -->
  <rect x="13" y="35" width="22" height="2" rx="1" fill="#555555"/>
  <rect x="13" y="35" width="9" height="2" rx="1" fill="#FF5722"/>
</svg>
