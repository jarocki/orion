# Orion-X Phoenix Edition — LightDM GTK greeter theme assets manifest
#
# @decision DEC-PHASE11-010
# @title W11-9a: LightDM orionx greeter theme assets directory
# @status accepted
# @rationale This directory (/usr/share/lightdm-gtk-greeter/orionx/) serves as
#   the Orion-X greeter asset tree. In W11-9a the wallpaper reference is
#   canonical (/opt/orionx/theme/wallpapers/orionx-phoenix-wallpaper.png) and
#   the GTK theme is transitional (Adwaita-dark). W11-9b replaces the
#   transitional theme references with Orion-X-Cyberdeck / Orion-X-Icons /
#   Iosevka once those assets land. The upgrade targets are documented below
#   so the W11-9b implementer can find them without searching.
#
# UPGRADE TARGETS for W11-9b (edit /etc/lightdm/lightdm-gtk-greeter.conf):
#   theme-name=Adwaita-dark         → Orion-X-Cyberdeck
#   icon-theme-name=Adwaita         → Orion-X-Icons
#   font-name=Sans 11               → Iosevka 11
#
# WALLPAPER AUTHORITY: /opt/orionx/theme/wallpapers/orionx-phoenix-wallpaper.png
#   is staged by scripts/build-iso.sh::stage_application_content() from
#   theme/wallpapers/orionx-phoenix-wallpaper.png (W9-1 wallpaper source).
#   Do NOT duplicate the wallpaper in this directory — reference the
#   canonical path to preserve the W9-1 single-authority rule.

# This file is an informational manifest; the active greeter configuration
# is /etc/lightdm/lightdm-gtk-greeter.conf (see that file for live settings).
#
# To verify greeter asset tree from a running system:
#   find /usr/share/lightdm-gtk-greeter/orionx/ -type f
#   grep background /etc/lightdm/lightdm-gtk-greeter.conf
