# Orion-X Phoenix Edition — runtime directory creation (systemd-tmpfiles)
#
# @decision DEC-PHASE11-022
# @title tmpfiles.d, not LogsDirectory=, is the authority for /var/log/orionx
# @status accepted
# @rationale Three units log via StandardOutput=append:/var/log/orionx/*.log.
#   W11-13 T2 added LogsDirectory=orionx on the assumption systemd creates the
#   directory before opening the append: target. On systemd 247 (bullseye) it
#   does not: stdio is set up before exec directories, so the unit dies
#   209/STDOUT with LogsDirectory correctly declared. Proven twice on hardware
#   (2026-08-03 and 2026-08-23 attestations); on 2026-08-25 a manual mkdir was
#   the only change needed for nebula-integrity-check to pass. systemd-tmpfiles
#   runs at boot before basic.target, so these directories exist before any
#   unit opens its output file. LogsDirectory= stays in the units as
#   documentation and ownership management; THIS file is what makes boot work.
d /var/log/orionx 1777 root root -
# DEC-PHASE12-108 (security F21): the directory stays 1777 because operator
# tools (nebula CLI, artifact-analyzer, rain_lib) and the nebula-mcp uid
# write their own logs there. But in a sticky world-writable directory any
# uid could pre-create a root unit's log name and make systemd's
# StandardOutput=append: open fail (209/STDOUT). The root units' log files are
# therefore created here, root-owned, before any user can claim the name.
f /var/log/orionx/nebula-integrity.log 0644 root root -
f /var/log/orionx/nebula-runtime.log   0644 root root -
f /var/log/orionx/nebula-warmup.log    0644 root root -
f /var/log/orionx/mesh.log             0644 root root -
d /run/orionx     0755 root root -
# R.A.I.N. event bus (DEC-PHASE11-045): the single JSONL spool detectors publish
# to and the orionx-rain daemon consumes. 0666 so both root detectors and the
# desktop user can append on this single-operator appliance; ephemeral (tmpfs).
f /run/orionx/events.jsonl 0666 root root -
