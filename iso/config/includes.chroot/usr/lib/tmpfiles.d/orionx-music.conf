# Orion-X music subsystem — the duck gate (DEC-PHASE12-044)
#
# @decision DEC-PHASE12-044
# @title tmpfiles.d pre-creates /run/orionx/music-duck 0666
# @status accepted
# @rationale /run/orionx is 0755 root:root (DEC-PHASE11-022), so a non-root
#   process cannot create a file in it. Any process that is about to occupy the
#   speaker — R.A.I.N.'s play_cue(), its spoken narrator, an operator running
#   `orionx-music duck` — must be able to tell the music deck to get out of the
#   way regardless of which uid it runs as. Pre-creating the gate 0666 here
#   makes that an O_WRONLY write to an existing file instead of a create in a
#   root-owned directory.
#
#   The gate is armed by writing a duration in seconds and DISARMED BY
#   TRUNCATION, never by unlink: deleting it would take this mode with it. An
#   empty gate — which is exactly what this line leaves at boot — means "not
#   armed", so a fresh boot does not start with the music held down.
#
#   Separate file rather than a line in orionx.conf: that file is the authority
#   for DEC-PHASE11-022's logging and bus paths and is not ours to edit.
#   systemd-tmpfiles merges every file in this directory.
f /run/orionx/music-duck 0666 root root -
